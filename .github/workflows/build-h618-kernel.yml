name: Build H618 kernel (clean / patched)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "unifreq linux-6.18.y tag (e.g. 6.18.59)"
        required: true
        default: "6.18.59"

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show custom patches
        run: |
          find kernel-patch -type f -print || true
          for f in kernel-patch/linux-6.18.y/*.patch; do
            [ -e "$f" ] && { echo "---- $f"; head -12 "$f"; }
          done
          echo "patch step done"

      - name: Compile the kernel
        uses: ahtsiu/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: unifreq
          kernel_version: ${{ inputs.kernel_version }}
          auto_kernel: "false"
          kernel_auto: "false"
          kernel_package: all
          kernel_sign: -ophub
          kernel_toolchain: gcc
          config_flavor: stable
          kernel_patch: kernel-patch
          auto_patch: "true"
          delete_source: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect output
        if: always()
        run: |
          echo "output path: ${PACKAGED_OUTPUTPATH}"
          mkdir -p dist
          if [ -d "${PACKAGED_OUTPUTPATH}" ]; then
            cp -v "${PACKAGED_OUTPUTPATH}"/*.tar.gz dist/ || true
          fi
          ls -lh dist || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.kernel_version }}
          path: dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
